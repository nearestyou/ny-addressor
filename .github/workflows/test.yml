name: CI
on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ny-addressor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: docker run --rm ny-addressor:test rake test
